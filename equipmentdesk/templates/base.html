<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}EquipmentDesk{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('main.index') }}">EquipmentDesk</a>
    {% if not hide_navigation and current_user.is_authenticated %}
      <nav aria-label="Điều hướng chính">
        <a href="{{ url_for('equipment.index') }}">Thiết bị</a>
        <a href="{{ url_for('loans.index') }}">Phiếu mượn</a>
        <span>{{ current_user.full_name }}</span>
        <form action="{{ url_for('auth.logout') }}" method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="logout" type="submit">Đăng xuất</button>
        </form>
      </nav>
    {% endif %}
  </header>
  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <p class="notice {{ category }}" role="status">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
